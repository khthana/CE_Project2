<html>
<head>
<title>Administrator Tools</title>
<meta http-equiv="Content-Type" content="text/html; charset=tis-620">
<style type="text/css">
<!--
body {  margin: 0px  0px; padding: 0px  0px}
a:link { color: #005CA2; text-decoration: none}
a:visited { color: #005CA2; text-decoration: none}
a:active { color: #0099FF; text-decoration: underline}
a:hover { color: #0099FF; text-decoration: underline}
-->
</style>
</head>

<body bgcolor="#FFFFFF">
<div align="center">
  <div align="left">
    <div align="center">
      <div align="left">
        <pre><b><font face="Angsana New, AngsanaUPC" size="+4">                  กรุณากรอกข้อมูลลูกค้า</font></b></pre>
      </div>
    </div>
  </div>
</div>
<hr width="80%" align="center">
<form name="form1" method="post" action="./servlet/UpdatePersonal.class">
  <table width="85%" border="1">
    <tr> 
      <td rowspan="2"> 
        <div align="center"> <font size="4">ข้อมูล</font></div>
      </td>
      <td colspan="3"><font size="4">ข้อมูลที่ต้องการแก้ไข</font></td>
      <td colspan="3"><font size="4">เปลี่ยนแปลงเป็น</font></td>
    </tr>
    <tr> 
      <td><font size="-3"><font size="4"> 
        <input type="radio" name="rbutton" value="rMr">
        Mr.</font></font> </td>
      <td><font size="-3"><font size="4">
        <input type="radio" name="rbutton" value="rMs">
        Ms.</font></font></td>
      <td><font size="-3"> <font size="4"> 
        <input type="radio" name="rbutton" value="rMrs">
        Mrs.</font></font></td>
      <td> <font size="-3"><font size="4">
        <input type="radio" name="rbutton2" value="rMr">
        Mr.</font></font> </td>
      <td> <font size="-3">
        <input type="radio" name="rbutton2" value="rMs">
        <font size="4">Ms.</font></font> </td>
      <td> <font size="-3">
        <input type="radio" name="rbutton2" value="rMrs">
        <font size="4">Mrs.</font></font> </td>
    </tr>
    <tr> 
      <td width="16%"> 
        <pre>       <font size="4">IDUser :</font></pre>
      </td>
      <td width="84%" colspan="3"> 
        <input type="text" name="txIdUser" size="5">
      </td>
      <td width="84%" colspan="3"> 
        <input type="text" name="txIdUser2" size="5">
      </td>
    </tr>
    <tr> 
      <td width="16%"> 
        <pre>       <font size="4">First Name :</font> </pre>
      </td>
      <td width="84%" colspan="3"> 
        <input type="text" name="txName" size="50">
      </td>
      <td width="84%" colspan="3"> 
        <input type="text" name="txName2" size="50">
      </td>
    </tr>
    <tr> 
      <td width="16%"> 
        <pre><font size="4">     Last Name :</font></pre>
      </td>
      <td width="84%" colspan="3"> 
        <input type="text" name="txSurname" size="50">
      </td>
      <td width="84%" colspan="3"> 
        <input type="text" name="txSurname2" size="50">
      </td>
    </tr>
    <tr> 
      <td width="16%"> 
        <pre><font size="4">     Address :</font></pre>
      </td>
      <td width="84%" colspan="3"> 
        <textarea name="txAddress" cols="50" rows="3"></textarea>
      </td>
      <td width="84%" colspan="3"> 
        <textarea name="txAddress2" cols="50" rows="3"></textarea>
      </td>
    </tr>
    <tr> 
      <td width="16%"> 
        <pre><font size="4">     Phone :</font></pre>
      </td>
      <td width="84%" colspan="3"> 
        <input type="text" name="txPhone" size="15">
      </td>
      <td width="84%" colspan="3"> 
        <input type="text" name="txPhone2" size="15">
      </td>
    </tr>
    <tr> 
      <td width="16%"> 
        <pre><font size="4">     Pager :</font></pre>
      </td>
      <td width="84%" colspan="3"> 
        <input type="text" name="txPager" size="4">
        <input type="text" name="txNumPager" size="7">
      </td>
      <td width="84%" colspan="3"> 
        <input type="text" name="txPager2" size="4">
        <input type="text" name="txNumPager2" size="7">
      </td>
    </tr>
    <tr> 
      <td width="16%"> 
        <pre><font size="4">     Email :</font></pre>
      </td>
      <td width="84%" colspan="3"> 
        <input type="text" name="txEmail" size="30">
      </td>
      <td width="84%" colspan="3"> 
        <input type="text" name="txEmail2" size="30">
      </td>
    </tr>
    <tr> 
      <td width="16%"> 
        <pre> <font size="4">    URL:</font></pre>
      </td>
      <td width="84%" colspan="3"> 
        <input type="text" name="txUrl" size="30">
      </td>
      <td width="84%" colspan="3"> 
        <input type="text" name="txUrl2" size="30">
      </td>
    </tr>
    <tr>
      <td width="16%">
        <pre><font size="4">     ICQ :</font></pre>
      </td>
      <td width="84%" colspan="3"> 
        <input type="text" name="txIcq" size="10">
      </td>
      <td width="84%" colspan="3">
        <input type="text" name="txIcq2" size="10">
      </td>
    </tr>
    <tr> 
      <td width="16%"> 
        <pre><font size="4">     Login :</font></pre>
      </td>
      <td width="84%" colspan="3"> 
        <input type="text" name="txUsername" size="30">
      </td>
      <td width="84%" colspan="3"> 
        <input type="text" name="txUsername2" size="30">
      </td>
    </tr>
    <tr> 
      <td width="16%"> 
        <pre><font size="4">     Password :</font></pre>
      </td>
      <td width="84%" colspan="3"> 
        <input type="text" name="txPassword" size="15">
      </td>
      <td width="84%" colspan="3"> 
        <input type="text" name="txPassword2" size="15">
      </td>
    </tr>
    <tr> 
      <td colspan="7"> 
        <pre>                                                                           <input type="submit" name="bUpdate" value="Update"> <input type="reset" name="bClear" value="Clear"></pre>
      </td>
    </tr>
  </table>
  <p>&nbsp;</p>
</form>

</body>
</html>
