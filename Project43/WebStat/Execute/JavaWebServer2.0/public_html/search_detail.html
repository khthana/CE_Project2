<body bgcolor="#FFFFFF">
<p align="center"><font size="6" face="Angsana New, AngsanaUPC">กรุณากรอกข้อมูลที่ต้องการ</font></p>
<hr width="80%">
<form name="form1" method="post" action="./servlet/SearchDetail.class">
  <table width="80%" border="1">
    <tr> 
      <td colspan="2" height="18"> 
        <pre>       <font size="4">ID User :</font> </pre>
      </td>
      <td width="70%" height="18"> 
        <input type="text" name="txIdUser" size="5">
      </td>
    </tr>
    <tr> 
      <td colspan="2"> 
        <pre><font size="4">     Browser Name :</font></pre>
      </td>
      <td width="70%"> 
        <input type="text" name="txBrowser" size="25">
      </td>
    </tr>
    <tr> 
      <td height="32" colspan="2"> 
        <pre><font size="4">     Version Browser :</font></pre>
      </td>
      <td width="70%" height="32"> 
        <input type="text" name="txVersion" size="20">
      </td>
    </tr>
    <tr> 
      <td colspan="2"> 
        <pre><font size="4">     Platform :</font></pre>
      </td>
      <td width="70%"> 
        <input type="text" name="txPlatform" size="20">
      </td>
    </tr>
    <tr> 
      <td colspan="2"> 
        <pre><font size="4">     ScreenWidth :</font></pre>
      </td>
      <td width="70%"> 
        <input type="text" name="txScreenW" size="5">
      </td>
    </tr>
    <tr> 
      <td colspan="2"> 
        <pre><font size="4">     ScreenHeight :</font></pre>
      </td>
      <td width="70%"> 
        <input type="text" name="txScreenH" size="5">
      </td>
    </tr>
    <tr> 
      <td colspan="2"> 
        <pre> <font size="4">    Time (hours) :</font></pre>
      </td>
      <td width="70%"> 
        <input type="text" name="txTime" size="2">
      </td>
    </tr>
    <tr> 
      <td colspan="2"> 
        <pre><font size="4">     Day :</font></pre>
      </td>
      <td width="70%"> 
        <input type="text" name="txDay" size="10">
      </td>
    </tr>
    <tr> 
      <td colspan="2"> 
        <pre><font size="4">     Date :</font></pre>
      </td>
      <td width="70%"> 
        <input type="text" name="txDate" size="2">
      </td>
    </tr>
    <tr> 
      <td colspan="2"> 
        <pre><font size="4">     Month :</font></pre>
      </td>
      <td width="70%"> 
        <input type="text" name="txMonth" size="10">
      </td>
    </tr>
    <tr> 
      <td colspan="2"> 
        <pre><font size="4">     Year :</font></pre>
      </td>
      <td> 
        <input type="text" name="txYear" size="4">
      </td>
    </tr>
    <tr> 
      <td colspan="2">
        <pre><font size="4">     Operating System :</font></pre>
      </td>
      <td>
        <input type="text" name="txOs" size="25">
      </td>
    </tr>
    <tr> 
      <td colspan="2">
        <pre><font size="4">     Referer :</font></pre>
      </td>
      <td>
        <input type="text" name="txReferer" size="50">
      </td>
    </tr>
    <tr> 
      <td colspan="3"> 
        <pre>                                      <input type="submit" name="hidden" value="Search"> <input type="submit" name="hidden" value="Search All"> <input type="reset" name="bReset" value="Clear"></pre>
      </td>
    </tr>

  <p>&nbsp;</p>
