<html>
<head>
<title>Administrator Tools</title>
<meta http-equiv="Content-Type" content="text/html; charset=tis-620">
<style type="text/css">

a:link { color: #005CA2; text-decoration: none}
a:visited { color: #005CA2; text-decoration: none}
a:active { color: #0099FF; text-decoration: underline}
a:hover { color: #0099FF; text-decoration: underline}
-->
</style>
</head>

<body bgcolor="#FFFFFF">
<div align="center">
  <div align="left">
    <div align="center">
      <div align="left">
        <pre><b><font face="Angsana New, AngsanaUPC" size="+4">     กรุณากรอกข้อมูลลูกค้า</font></b></pre>
      </div>
    </div>
  </div>
</div>
<hr width="80%" align="center">
<form name="form1" method="post" action="./servlet/DeletePersonal.class">
  <table width="80%" border="0">
    <tr> 
      <td> 
        <pre><font size="4">  <input type="radio" name="rbutton" value="rMr">Mr</font>.</pre>
      </td>
      <td> 
        <pre><font size="4">  <input type="radio" name="rbutton" value="rMs">Ms.</font></pre>
      </td>
      <td> 
        <pre><font size="4">  <input type="radio" name="rbutton" value="rMrs">Mrs. </font></pre>
      </td>
    </tr>
    <tr> 
      <td width="16%" colspan="2"> 
        <pre>       <font size="4">IDUser :</font></pre>
      </td>
      <td width="84%"> 
        <input type="text" name="txIdUser" size="5">
      </td>
    </tr>
    <tr> 
      <td width="16%" colspan="2"> 
        <pre>       <font size="4">First Name :</font> </pre>
      </td>
      <td width="84%"> 
        <input type="text" name="txName" size="50">
      </td>
    </tr>
    <tr> 
      <td width="16%" colspan="2"> 
        <pre><font size="4">     Last Name :</font></pre>
      </td>
      <td width="84%"> 
        <input type="text" name="txSurname" size="50">
      </td>
    </tr>
    <tr> 
      <td width="16%" colspan="2"> 
        <pre><font size="4">     Address :</font></pre>
      </td>
      <td width="84%"> 
        <textarea name="txAddress" cols="50" rows="3"></textarea>
      </td>
    </tr>
    <tr> 
      <td width="16%" colspan="2"> 
        <pre><font size="4">     Phone :</font></pre>
      </td>
      <td width="84%"> 
        <input type="text" name="txPhone" size="15">
      </td>
    </tr>
    <tr> 
      <td width="16%" colspan="2"> 
        <pre><font size="4">     Pager :</font></pre>
      </td>
      <td width="84%"> 
        <input type="text" name="txPager" size="4">
        <input type="text" name="txNumPager" size="7">
      </td>
    </tr>
    <tr> 
      <td width="16%" colspan="2"> 
        <pre><font size="4">     Email :</font></pre>
      </td>
      <td width="84%"> 
        <input type="text" name="txEmail" size="30">
      </td>
    </tr>
    <tr> 
      <td width="16%" colspan="2"> 
        <pre> <font size="4">    URL:</font></pre>
      </td>
      <td width="84%"> 
        <input type="text" name="txUrl" size="30">
      </td>
    </tr>
    <tr> 
      <td width="16%" colspan="2"> 
        <pre><font size="4">     ICQ :</font></pre>
      </td>
      <td width="84%"> 
        <input type="text" name="txIcq" size="10">
      </td>
    </tr>
    <tr> 
      <td width="16%" colspan="2"> 
        <pre><font size="4">     Login :</font></pre>
      </td>
      <td width="84%"> 
        <input type="text" name="txUsername" size="30">
      </td>
    </tr>
    <tr> 
      <td width="16%" colspan="2"> 
        <pre><font size="4">     Password :</font></pre>
      </td>
      <td width="84%"> 
        <input type="text" name="txPassword" size="15">
      </td>
    </tr>
    <tr> 
      <td colspan="3"> 
        <pre>                                  <input type="submit" name="bDelete" value="Delete"> <input type="reset" name="bClear" value="Clear"></pre>
      </td>
    </tr>
  </table>
  <p>&nbsp;</p>
</form>

</body>
</html>
