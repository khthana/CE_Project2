<HTML><HEAD><TITLE>CheckOutForm</TITLE></HEAD>
    
<BODY bgcolor="#CCCCFF">
<form method=get action="http://myproject/jservlets/InsertBook">
	
  <h1 align="center"><font color="#6633FF">Add New Book</font></h1>
  <p>&nbsp;</p>
  <table width="100%" border="0">
    <tr> 
      <td width="17%" height="36">&nbsp;</td>
      <td width="25%" height="36"><font size="4"><b>Book name</b></font> </td>
      <td width="39%" height="36"> 
        <input type="text" name="book_name">
      </td>
      <td width="19%" height="36">&nbsp;</td>
    </tr>
    <tr> 
      <td width="17%" height="38">&nbsp;</td>
      <td width="25%" height="38"><font size="4"><b>Book name Thai</b></font> 
      </td>
      <td width="39%" height="38"> 
        <input type="text" name="book_name_t">
      </td>
      <td width="19%" height="38">&nbsp;</td>
    </tr>
    <tr> 
      <td width="17%" height="36">&nbsp;</td>
      <td width="25%" height="36"><font size="4"><b>Book type</b></font> </td>
      <td width="39%" height="36"> 
        <input type="text" name="book_type">
      </td>
      <td width="19%" height="36">&nbsp;</td>
    </tr>
    <tr> 
      <td width="17%" height="38">&nbsp;</td>
      <td width="25%" height="38"><font size="4"><b>Book path</b></font></td>
      <td width="39%" height="38"> 
        <input type="text" name="book_path">
      </td>
      <td width="19%" height="38">&nbsp;</td>
    </tr>
    <tr> 
      <td width="17%" height="104">&nbsp;</td>
      <td width="25%" height="104" align="left" valign="top"> 
        <p><font size="4"><b>Book desc</b></font> </p>
        <p>&nbsp;</p>
        <p>&nbsp;</p>
        <p>&nbsp;</p>
      </td>
      <td width="39%" height="104" align="left" valign="top"> 
        <TEXTAREA NAME="book_desc" ROWS="6" COLS="50" wrap="PHYSICAL"></TEXTAREA>
        <p>&nbsp;</p>
        </td>
      <td width="19%" height="104">&nbsp;</td>
    </tr>
    <tr> 
      <td width="17%">&nbsp;</td>
      <td width="25%"> 
        <div align="center"> </div>
      </td>
      <td width="39%"> 
        <input type=submit value="Submit" name="submit">
        <input type=reset value="Reset" name="reset">
      </td>
      <td width="19%">&nbsp;</td>
    </tr>
  </table>
  <p>&nbsp;</p>
  <p>&nbsp;</p>
</form>
   </BODY></HTML>
