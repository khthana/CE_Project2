<HTML><HEAD><TITLE>Insert New Volume</TITLE></HEAD>
    
<BODY bgcolor="#CCCCFF">
<form method=get action="http://myproject/jservlets/InsertVolume">
	
  <h1 align="center"><font color="#3333FF">Add New Volume</font></h1>
  <p>&nbsp;</p>
  <table width="100%" border="0">
    <tr> 
      <td width="22%" height="41">&nbsp;</td>
      <td width="21%" height="41"><font size="4"><b>Book name</b></font> </td>
      <td width="27%" height="41"> 
        <input type="text" name="book_name" maxlength="20">
      </td>
      <td width="30%" height="41">&nbsp;</td>
    </tr>
    <tr> 
      <td width="22%" height="34">&nbsp;</td>
      <td width="21%" height="34"><font size="4"><b>Volume </b></font></td>
      <td width="27%" height="34"> 
        <input type="text" name="volume" maxlength="4">
      </td>
      <td width="30%" height="34">&nbsp;</td>
    </tr>
    <tr> 
      <td width="22%" height="42">&nbsp;</td>
      <td width="21%" height="42"><font size="4"><b>Page quantity </b></font></td>
      <td width="27%" height="42"> 
        <input type="text" name="page_quantity" maxlength="4">
      </td>
      <td width="30%" height="42">&nbsp;</td>
    </tr>
    <tr> 
      <td width="22%" height="40">&nbsp;</td>
      <td width="21%" height="40"><font size="4"><b>Rent price </b></font></td>
      <td width="27%" height="40"> 
        <input type="text" name="rent_price" maxlength="4">
      </td>
      <td width="30%" height="40">&nbsp;</td>
    </tr>
    <tr> 
      <td width="22%" height="42">&nbsp;</td>
      <td width="21%" height="42">&nbsp; </td>
      <td width="27%" height="42"> 
        <input type=submit value="Submit" name="submit">
        <input type=reset value="Reset" name="reset">
      </td>
      <td width="30%" height="42">&nbsp;</td>
    </tr>
  </table>
  <p>&nbsp; </p>
  </form>
   </BODY></HTML>
