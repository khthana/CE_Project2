<SCRIPT LANGUAGE="JavaScript">
	function ConfirmRemove(){
		var check_rv=false;
		if (form1.length>1){
			if (form1.length>2)
				for (ct=0; ct<(form1.length-1); ct++){
					if (form1.checkbox[ct].checked){
						check_rv=true;break;
					}
				}
			else if (form1.checkbox.checked)
					check_rv=true;
		}
		if (check_rv)
			if (!confirm('Are you sure ?')) {
				if (form1.length>2){
					for (count=0; count<(form1.length-1); count++)
						form1.checkbox[count].checked=false;
				}
				else form1.checkbox.checked=false;
			}
	}
</SCRIPT>
