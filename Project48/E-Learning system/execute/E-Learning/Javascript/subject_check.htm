<script language="javascript" type="text/JavaScript">
function Check() {
	var subject_ID= document.getElementById("subject_ID");
	var subject_name = document.getElementById("subject_name");
	var short_description = document.getElementById("short_description");
	var description = document.getElementById("description");
	var subject_point = document.getElementById("subject_point");
	if (subject_ID.value == ""){
		alert("กรุณากรอก รหัสวิชา");
		subject_ID.focus();
		return false;
	}
	else if (subject_name.value == ""){
		alert("กรุณากรอก ชื่อวิชา");
		subject_name.focus();
		return false;
	}
	else if (short_description.value == ""){
		alert("กรุณากรอก คำบรรยายภาพรวม");
		short_description.focus();
		return false;
	}
	else if (description.value == ""){
		alert("กรุณากรอก คำบรรยายวิชา");
		description.focus();
		return false;
	}
		else if (subject_point.value == "0"){
		alert("กรุณาเลือก หน่วยกิจ");
		subject_point.focus();
		return false;
	    }
		else if(isNaN(subject_ID.value)){
		alert("รหัสวิชา ต้องเป็นตัวเลขค่ะ");
		subject_ID.focus();
		return false;
		}
}
</script>
