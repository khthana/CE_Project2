<body OnLoad='javascript:ReloadSrc();' bgcolor="#FFCC66">
<table border=1>
<tr height=400>
	<td width=400 bgcolor="#FFFFFF">
		<img Name='map' id='map' border=0 OnMouseMove="javascript:ShowCoMap(event);" OnMouseOut="status='';" OnClick="javascript:MoveMap(event);">
	</td> 
</tr>
<tr>
	<td valign=top align=center width=180>
	<table border=0 width=120>
	<tr width="100%">
		<td colspan=3 align=middle>
			<img Name='mov' id='mov' src="/images/map_2.jpg"  border=0 OnClick="javascript:Move(event);" OnMouseMove="javascript:ShowCoMove(event);" OnMouseOut="status='';">
		<td>
	</tr>
	<tr>
		<td align=center >
			<a Href = "javascript:ZoomIn();" ><img src ="/images/zoom_in.gif" alt="Zoom In" border=0 OnMouseMove='status="Zoom In"' OnMouseOut="status='';"></a>
		</td>
		<td  align=center>
			<img src ="/images/mover.gif" border='0' usemap="#mover" >
		</td>
		<td align=center >
			<a Href ="javascript:ZoomOut();" ><img src ="/images/zoom_out.gif" alt='Zoom Out' border=0 OnMouseMove='status="Zoom Out"' OnMouseOut="status='';" ></a>
		</td>
	</tr>
	</table>
	</td>
</tr>
<map name="mover">
	<area shape="rect" coords="  0,   0, 21, 20" Href="javascript:MoveNE();" alt="Move NE" OnMouseMove='status="Move NE"' OnMouseOut="status='';">
	<area shape="rect" coords="22,   0, 43, 20" Href="javascript:MoveN();" alt="Move N" OnMouseMove='status="Move N"' OnMouseOut="status='';">
	<area shape="rect" coords="44,   0, 65, 20" Href="javascript:MoveNW();" alt="Move NW" OnMouseMove='status="Move NW"' OnMouseOut="status='';">
	<area shape="rect" coords="  0, 21, 21, 42" Href="javascript:MoveE();" alt="Move E" OnMouseMove='status="Move E"' OnMouseOut="status='';">
	<area shape="rect" coords="22, 21, 43, 42" Href="javascript:ResetSize();" alt="ResetSize" OnMouseMove='status="ResetSize"' OnMouseOut="status='';">
	<area shape="rect" coords="44, 21, 65, 42" Href="javascript:MoveW();" alt="Move W" OnMouseMove='status="Move W"' OnMouseOut="status='';">
	<area shape="rect" coords="  0, 43, 21, 64" Href="javascript:MoveSE();" alt="Move SE" OnMouseMove='status="Move SE"' OnMouseOut="status='';">
	<area shape="rect" coords="22, 43, 43, 64" Href="javascript:MoveS();" alt="Move S" OnMouseMove='status="Move S"' OnMouseOut="status='';">
	<area shape="rect" coords="44, 43, 65, 64" Href="javascript:MoveSW();" alt="Move SW" OnMouseMove='status="Move SW"' OnMouseOut="status='';">
</map>
