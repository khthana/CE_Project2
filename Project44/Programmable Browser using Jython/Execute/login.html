<html>
<head>
<title>Un title page</title>

</head>

<body bgcolor="#FFFFFF">
<div align="center"><font size="5"><b><font color="#33CC99">Welcome to Programmable 
  Browser login page</font></b> </font> </div>
<form name="loginForm" method="get" action="mainframe.html">
  <div align="center">
    <table width="58%" border="0" bordercolor="#FFFFFF" bgcolor="#FFFFFF">
      <tr> 
        <td width="35%"><font size="4"><b><font color="#0000FF">Username</font></b></font><font color="#0000FF"> 
          <font size="4"><b>:</b> </font></font></td>
        <td width="65%"> 
          <input type="text" name="usrName">
        </td>
      </tr>
      <tr> 
        <td width="35%"><font size="4"><b><font color="#0000FF">Password :</font></b></font></td>
        <td width="65%"> 
          <input type="password" name="usrPwd" value="">
        </td>
      </tr>
      <tr> 
        <td width="35%">&nbsp;</td>
        <td width="65%"> 
          <input type="submit" name="Submit" value="Login">
          <input type="reset" name="Submit2" value="Reset">
        </td>
      </tr>
    </table>
    
  </div>
</form>
</body>
</html>
