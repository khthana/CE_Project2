  <script>
            <![CDATA[
                var svgDocument = null;
                var tipBox = null;
                var tipText = null;
                var TrueCoords = null;
                
                var tooltip = null; 
                /// Car
                var startx = 0;
                var starty = 0;
                var endx = 0;
                var endy = 0;
                var objectCoor = null;
                function setCx(evt)
                {   		    
                    object = svgRoot.getElementById("object");
                    object.setAttribute("cx", 0);
                    object.setAttribute("cy", 0);		    
                    startx = endx;
                    starty = endy;
                }
                function move(evt)
                {
                    //endx = evt.getClientX();
                    //endy = evt.getClientY();
                    trueCoordinate(evt);
                    endx = objectCoor.x;
                    endy = objectCoor.y;
                    object = svgRoot.getElementById("object");		    
                    difx = endx - object.getAttribute("cx");
                    dify = endy - object.getAttribute("cy");		    
                    animate = svgRoot.getElementById("animate");
                    animate.endElement();
                    animate.setAttribute( "from", startx + "," + starty);
                    animate.setAttribute( "to", difx + "," + dify );
                    animate.beginElement();
                }
                function trueCoordinate(evt)
                {
                    // find the current zoom level and pan setting, and adjust the reported
                    // mouse position accordingly
                    svgDocument = evt.getTarget().getOwnerDocument();
                    svgRoot = svgDocument.documentElement;	
                    objectScale = svgRoot.currentScale;
                    objectTranslation = svgRoot.currentTranslate;
                    
                    viewBoxes = svgRoot.getAttribute( "viewBox" );
                    posi = viewBoxes.indexOf(" ");
                    posi2 = posi+1;
                    view_x = viewBoxes.substring( 0, posi );
                    view_x_int = parseFloat(view_x);
                    posi = viewBoxes.indexOf(" ", posi2);
                    view_y = viewBoxes.substring( posi2, posi );
                    view_y_int = parseFloat(view_y);
                    
                    objectCoor.x = view_x_int+(evt.getClientX() - objectTranslation.x)*100/objectScale;
                    objectCoor.y = view_y_int+(evt.getClientY() - objectTranslation.y)*100/objectScale;                    
                };
                ///////////end Car/////////
                function init(evt)
                {
                    svgDocument = evt.getTarget().getOwnerDocument();
                    svgRoot = svgDocument.documentElement;	
                    tipBox = svgRoot.getElementById("tipBox");
                    tipText = svgRoot.getElementById("tipText");
                    TrueCoords = svgRoot.createSVGPoint();
                    objectCoor = svgRoot.createSVGPoint();
                    TrueCoordsToolTip = svgRoot.createSVGPoint();
                    tooltip = svgRoot.getElementById("tooltipss");  
		   // alert("INIT"+svgDocument+","+tipBox+","+tipText+","+tooltip+","+svgRoot);
                }
                function GetTrueCoords(evt)
                {
                    // find the current zoom level and pan setting, and adjust the reported
                    // mouse position accordingly
                    svgDocument = evt.getTarget().getOwnerDocument();
                    svgRoot = svgDocument.documentElement;	
                    newScale = svgRoot.currentScale;
                    translation = svgRoot.currentTranslate;
                    
                    viewBoxes = svgRoot.getAttribute( "viewBox" );
                    posi = viewBoxes.indexOf(" ");
                    posi2 = posi+1;
                    view_x = viewBoxes.substring( 0, posi );
                    view_x_int = parseFloat(view_x);
                    posi = viewBoxes.indexOf(" ", posi2);
                    view_y = viewBoxes.substring( posi2, posi );
                    view_y_int = parseFloat(view_y);
                    
                    TrueCoords.x = view_x_int+(evt.getClientX() - translation.x)*100/newScale;
                    TrueCoords.y = view_y_int+(evt.getClientY() - translation.y)*100/newScale;
                    
                };
                function hideTooltip(evt)
                {
                    tooltip.setAttributeNS(null, 'visibility', 'hidden');
		    tipBox.setAttributeNS(null, 'visibility', 'hidden');
                }
                function position(evt,txtDesc)
                {                   
                    GetTrueCoords(evt);
		    tipScale = 1/svgRoot.currentScale;
		    tipBox.setAttributeNS(null, 'transform', 'scale(' + tipScale + ',' + tipScale + ')' );
		    tipText.setAttributeNS(null, 'transform', 'scale(' + tipScale + ',' + tipScale + ')' );
		    
		    tipText.firstChild.setData(txtDesc);

		    xPos=TrueCoords.x+(750*tipScale);
		    yPos=TrueCoords.y+(750*tipScale);
		    /////Add new/////
                    outLine = tipText.getBBox();		
                    tipBox.setAttribute('width',Number(outLine.width)+1500);
                    tipBox.setAttribute('height',Number(outLine.height)+1000);		
                    tipBox.setAttribute('visibility', 'visible');
		    tooltip.setAttribute('visibility', 'visible');
		    tooltip.setAttributeNS(null, 'transform', 'translate(' + xPos + ',' + yPos + ')');
		}	    
            ]]>
        </script>
    	
